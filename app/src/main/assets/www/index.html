<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Skull Kid</title>
<style>
html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; color:#fff; font-family:sans-serif; }
#stage { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
#game { width:min(100vw, calc(100vh * 11 / 8)); height:min(100vh, calc(100vw * 8 / 11)); transform-origin:center center; }
ruffle-player { width:100%; height:100%; }
#status { position:absolute; left:20px; bottom:20px; color:#ddd; font-size:14px; }
</style>
</head>
<body>
<div id="stage"><div id="game"></div></div>
<div id="status">Starting Skull Kid…</div>
<script>
window.RufflePlayer = window.RufflePlayer || {};
window.RufflePlayer.config = {
  autoplay: 'on', unmuteOverlay: 'visible', letterbox: 'on', contextMenu: 'off',
  allowScriptAccess: true, allowNetworking: 'all', publicPath: 'ruffle/',
  quality: 'high'
};
let player;
let skullMenuPaused = false, skullBackgroundPaused = false, skullRufflePaused = false;
let skullDisplayMode = 'original';
function syncRufflePause() {
  const paused = skullMenuPaused || skullBackgroundPaused;
  if (!player || skullRufflePaused === paused) return;
  try {
    if (paused) player.ruffle().suspend();
    else player.ruffle().resume();
  } catch (error) {
    try {
      if (paused && typeof player.pause === 'function') player.pause();
      else if (!paused && typeof player.play === 'function') player.play();
    } catch (fallbackError) {
      console.warn('SkullKid pause failed', fallbackError);
      return;
    }
  }
  skullRufflePaused = paused;
  if (!paused && player) player.focus();
}
window.skullSetMenuPaused = value => {
  skullMenuPaused = !!value;
  if (skullMenuPaused) window.skullClearKeys();
  syncRufflePause();
};
window.skullSetBackgroundPaused = value => {
  skullBackgroundPaused = !!value;
  if (skullBackgroundPaused) window.skullClearKeys();
  syncRufflePause();
};
window.skullSetDisplayMode = mode => {
  skullDisplayMode = mode === 'stretch' ? 'stretch' : 'original';
  const game = document.getElementById('game');
  if (!game) return;
  game.style.transform = '';
  if (skullDisplayMode === 'stretch') {
    const box = game.getBoundingClientRect();
    if (box.width && box.height) {
      game.style.transform = 'scale(' + (innerWidth / box.width) + ',' + (innerHeight / box.height) + ')';
    }
  }
};
window.addEventListener('resize', () => window.skullSetDisplayMode(skullDisplayMode));
document.addEventListener('visibilitychange', () => window.skullSetBackgroundPaused(document.hidden));
const keys = {
  up:{key:'ArrowUp',code:'ArrowUp',keyCode:38},
  down:{key:'ArrowDown',code:'ArrowDown',keyCode:40},
  left:{key:'ArrowLeft',code:'ArrowLeft',keyCode:37},
  right:{key:'ArrowRight',code:'ArrowRight',keyCode:39},
  attack:{key:' ',code:'Space',keyCode:32}
};
const sources = Object.create(null);
const keyRepeats = Object.create(null);
function sendSkullKey(id, pressed, repeat = false) {
  const spec = keys[id];
  player.dispatchEvent(new KeyboardEvent(pressed ? 'keydown' : 'keyup', {
    key:spec.key, code:spec.code, keyCode:spec.keyCode, which:spec.keyCode,
    bubbles:true, composed:true, cancelable:true, repeat:repeat
  }));
}
function stopKeyRepeat(id) {
  const timer = keyRepeats[id];
  if (!timer) return;
  clearTimeout(timer.delay);
  clearInterval(timer.interval);
  delete keyRepeats[id];
}
function startKeyRepeat(id) {
  stopKeyRepeat(id);
  const timer = keyRepeats[id] = {};
  // The original game's keyDown handlers rely on keyboard auto-repeat to
  // change movement at collisions and continue the two-stage boss attack.
  timer.delay = setTimeout(() => {
    timer.interval = setInterval(() => {
      if (!player || skullMenuPaused || skullBackgroundPaused || !sources[id]?.size) {
        stopKeyRepeat(id);
        return;
      }
      sendSkullKey(id, true, true);
    }, 65);
  }, 400);
}
window.skullKey = (id, pressed, source) => {
  if (pressed && (skullMenuPaused || skullBackgroundPaused)) return;
  if (!keys[id] || !player) return;
  if (!sources[id]) sources[id] = new Set();
  const wasDown = sources[id].size > 0;
  if (pressed) sources[id].add(source); else sources[id].delete(source);
  const nowDown = sources[id].size > 0;
  if (wasDown === nowDown) return;
  player.focus();
  sendSkullKey(id, nowDown);
  if (nowDown) startKeyRepeat(id); else stopKeyRepeat(id);
};
window.skullClearKeys = () => {
  for (const [id, holders] of Object.entries(sources)) {
    stopKeyRepeat(id);
    if (!holders.size) continue;
    holders.clear();
    if (player) sendSkullKey(id, false);
  }
};
window.addEventListener('load', async () => {
  const status = document.getElementById('status');
  try {
    const ruffle = window.RufflePlayer.newest();
    if (!ruffle) throw new Error('Ruffle runtime missing');
    player = ruffle.createPlayer();
    document.getElementById('game').appendChild(player);
    await player.ruffle().load({
      url:'/game/skull-kid.swf', allowNetworking:'all',
      allowScriptAccess:true, quality:'high'
    });
    // Ruffle 0.7.1 creates its runtime during load(); earlier observer assignments
    // are discarded. Attach here before Flash starts executing its first frame.
    player.ruffle().traceObserver = message => {
      if (typeof message === 'string' && message.startsWith('SKULLDBG_'))
        console.info(message);
    };
    status.remove();
    window.skullSetDisplayMode(skullDisplayMode);
    syncRufflePause();
    player.focus();
  } catch (e) {
    status.textContent = 'Game load failed: ' + String(e);
    console.error('SkullKid load failed', e);
  }
});
</script>
<script src="ruffle/ruffle.js"></script>
</body>
</html>
