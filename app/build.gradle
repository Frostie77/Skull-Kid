plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.frostie77.skullkid'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.frostie77.skullkid'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    buildTypes {
        debug { versionNameSuffix '-dev' }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources {
        noCompress += ['swf', 'wasm']
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.13.0'
    implementation project(':frostfrontend')
}

