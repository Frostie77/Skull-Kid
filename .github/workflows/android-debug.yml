name: Android builds and update verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and pinned FrostFrontend
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Test the production update verifier
        run: python3 tests/test_updates.py

      - name: Use runner preinstalled Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT" && test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          test -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

      - name: Install Android 35 platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Retrieve official Ruffle 0.7.1 runtime
        run: |
          mkdir -p /tmp/ruffle-package app/src/main/assets/www/ruffle
          curl --fail --silent --show-error --location \
            https://registry.npmjs.org/@ruffle-rs/ruffle/-/ruffle-0.7.1.tgz \
            -o /tmp/ruffle-0.7.1.tgz
          tar -xzf /tmp/ruffle-0.7.1.tgz -C /tmp/ruffle-package
          rufflejs="$(find /tmp/ruffle-package -type f -name ruffle.js -print -quit)"
          test -n "$rufflejs"
          cp -R "$(dirname "$rufflejs")"/. app/src/main/assets/www/ruffle/

      - name: Verify game SWF is not committed
        run: |
          if find app/src/main/assets/www -type f -iname '*.swf' | grep -q .; then
            echo 'Unexpected original Flash game in assets.'
            exit 1
          fi

      - name: Compile Debug and Release Android APKs
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Verify APK contains no copyrighted game SWF
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          for variant, filename in (("debug", "app-debug.apk"), ("release", "app-release-unsigned.apk")):
              apk = Path('app/build/outputs/apk') / variant / filename
              assert apk.is_file(), f'{variant} APK was not generated'
              with ZipFile(apk) as z:
                  names = set(z.namelist())
                  assert not any(p.lower().endswith('.swf') for p in names), 'Game SWF bundled'
                  assert 'assets/www/ruffle/ruffle.js' in names, 'Ruffle missing'
                  assert 'assets/www/index.html' in names, 'Game wrapper missing'
                  assert any(p.startswith('res/') and 'ic_launcher' in p for p in names), 'Approved launcher icon missing'
              print(f'PASS: {variant} APK contains Ruffle and the approved launcher icon without game SWF')
          PY

      - name: Retain development APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: Skull-Kid-Android-debug-unsigned-for-testing
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  windows-release-script:
    runs-on: windows-latest
    steps:
      - name: Check out release helper
        uses: actions/checkout@v4
      - name: Parse release helper with Windows PowerShell 5.1
        shell: powershell
        run: |
          $parseErrors = $null
          $tokens = $null
          $file = Join-Path $env:GITHUB_WORKSPACE 'build-public-release.ps1'
          [System.Management.Automation.Language.Parser]::ParseFile(
            $file, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host 'PASS: release helper parses in Windows PowerShell 5.1.'
